<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Hololive English</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="css/principal.css">
        <link rel="stylesheet" href="css/aside.css">
        <link rel="stylesheet" href="css/wallpapers.css">

        <script type="importmaps">
            {
                "imports": {
                    "script": "./js/"
                }
            }
        </script>
        <!-- Definindo o caminho das importações para ter certeza que o script com ESModules rode corretamente. -->

        <script type="module" src="./js/app.js"></script>
        <script src="./js/carrossel.js" defer></script>
    </head>
    
    <body>
        <header>
            <h1>Hololive English</h1>

            <a href="https://hololivepro.com/en" target="_blank">Site Oficial</a>
        </header>

        <aside>
            <article id="talentosDesc"></article>
            <!-- Conteúdo criado dinâmicamente no app.js -->

            <section id="talentosInfoComentarios">
                <h2>Informações sobre os talentos</h2>

                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Aniversário</th>
                            <th>Altura</th>
                        </tr>
                    </thead>

                    <tbody class="tabelaInfo"></tbody>

                    <tfoot>
                        <tr>
                            <td colspan="3">*Com limitador, Sem limitador: 1,697,840km</td>
                        </tr>
                    </tfoot>
                </table>

                <form>
                    <fieldset>
                        <legend>Comentários</legend>

                        <textarea name="Comentários" cols="50" rows="10" placeholder="Deixe aqui seus comentários"></textarea>

                        <p>
                            <input type="submit" value="Enviar">
                        </p>
                    </fieldset>
                </form>
            </section>
        </aside>

        <main>
            <nav id="grupos"></nav>

            <section id="talentosImgs"></section>
        </main>

        <section id="talentosWallpapers">
            <div class="papel1"></div>
            <div class="papel2"></div>
            <div class="papel3"></div>
            <!-- Exibição de imagens feita inicialmente pelo css e depois alterada dinâmicamente em carrossel.js -->
        </section>

        <footer>
            <blockquote>Site criado por Márcio Teodoro, Sanallite<br>
            Copyright 2016 Cover Corp. Todos os direitos reservados. - All rights reserved.</blockquote>
        </footer>
    </body>
</html>
