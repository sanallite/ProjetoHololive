<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hololive English</title>
    <link rel="stylesheet" href="../css/paginaTalentos.css">
    <link rel="stylesheet" href="../css/playerAudio.css">

    <script src="https://apis.google.com/js/api.js"></script>
    <!-- Importando a biblioteca de APIs do Google -->

    <script type="module" src="../js/paginaTalentos.js"></script>
    <script type="module" src="../js/playerAudio.js"></script>
</head>
<body>
    <header>
        <a href="../index.html">
            <h1>Hololive English</h1>
        </a>

        <a href="https://hololivepro.com/en" target="_blank">Site Oficial</a>
    </header>
    <main>
        <nav>
            <h2>Página dos Talento</h2>
            <button>Página Inicial</button>
        </nav>

        <section id="imagensDesc">
            <div class="thumbnails"></div>
            <div class="fotoPrincipal"></div>
            <article>Descrição</article>
        </section>

        <section id="historiaDetalhes">
            <h3>História</h3>
            <p></p>

            <aside>
                <table>
                    <tbody>
                        <th colspan="2">Detalhes</th>
                    </tbody>
                </table>
            </aside>
        </section>

        <section id="clipes">
            <h3>Clipes de Música</h3>

            <div></div>
        </section>

        <section id="musicas">
            <div class="capa">
                <img class="capa" src="" alt="Capa da música sendo tocada atualmente.">
            </div>

            <div class="player">
                <audio class="player" preload="auto"></audio>

                <div class="controles">
                    <button class="play">Play</button>
                    <button class="pause">Pause</button>
                    <button class="proxima">Próxima</button>
                    <button class="anterior">Anterior</button>
                </div>

                <div class="progresso">
                    <div class="barraProgresso"></div>
                </div>

                <p>Now Playing:</p>
                <p class="nome"></p>
            </div>
        </section>
    </main>
    <footer>
        <blockquote>
            Site criado por Márcio Teodoro, Sanallite<br>
            Copyright 2016 Cover Corp. Todos os direitos reservados. - All rights reserved.
        </blockquote>
    </footer>
</body>
</html>
