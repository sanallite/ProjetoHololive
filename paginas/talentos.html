<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site de Fã - Hololive English</title>
    <link rel="stylesheet" href="../css/principal.css">
    <link rel="stylesheet" href="../css/paginaTalentos.css">
    <link rel="stylesheet" href="../css/playerAudio.css">

    <script src="https://apis.google.com/js/api.js"></script>
    <!-- Importando a biblioteca de APIs do Google -->

    <script type="module" src="../js/paginaTalentos.js"></script>
    <script type="module" src="../js/playerAudio.js"></script>
</head>
<body>
    <header class="hoverRoxo">
        <a href="../index.html">
            <h1>Site de Fã - Hololive English</h1>
        </a>

        <a href="https://hololivepro.com/en" target="_blank">Site Oficial</a>
    </header>
    <main>
        <section id="tituloImg">
            <h2 class="hoverRoxo">Página do Talento</h2>

            <section class="imagens">
                <div class="thumbnails"></div>
                <div class="fotoPrincipal"></div>
            </section>
        </section>

        <aside id="descicao">
            <article class="descricao">Descrição</article>
        </aside>

        <section id="historiaClipes">
            <article class="historia"></article>
            <!-- Conteúdo criado dinâmicamente em paginaTalentos.js -->

            <section id="clipes">
                <h3>Clipes de Música</h3>

                <div></div>
            </section>

            <button>Página Inicial</button>
        </section>

        <aside id="tabelaMusicas">
            <section id="musicas">
                <div class="capa">
                    <img class="capa" src="" alt="Capa da música sendo tocada atualmente.">
                </div>

                <div class="progresso">
                    <div class="barraProgresso"></div>
                </div>

                <div class="player">
                    <audio class="player" preload="auto"></audio>

                    <div class="controles">
                        <button class="anterior" aria-label="Música anterior">
                            <img src="../assets/img/layout/skip-backward-fill.svg">
                        </button>

                        <button class="play" aria-label="Tocar música">
                            <img src="../assets/img/layout/play-fill.svg">
                        </button>

                        <button class="pause" aria-label="Pausar música">
                            <img src="../assets/img/layout/pause-fill.svg">
                        </button>

                        <button class="proxima" aria-label="Próxima música">
                            <img src="../assets/img/layout/skip-forward-fill.svg">
                        </button>    
                    </div>

                    <p><em>Now Playing:</em></p>
                    <p class="nome"></p>
                </div>
            </section>

            <table>
                <tbody>
                    <th colspan="2">Detalhes</th>
                </tbody>
            </table>
        </aside>
    </main>

    <footer class="hoverRoxo">
        <blockquote>
            Site criado por Márcio Teodoro, Sanallite<br>
            Copyright 2016 Cover Corp. Todos os direitos reservados. - All rights reserved.
        </blockquote>
    </footer>
</body>
</html>
